<div>
  <nav id="responsiveNav"
       class="navbar-inverse"
       ng-class="::{'navbar':!isViewNative, 'is-native': isViewNative}"
       role="navigation"
       aria-label="${Primary}">
    <div class="container-fluid">
      <div ng-show="::!isViewNative" class="navbar-header">
        <a class="navbar-brand"
           ng-if="::!portal.logo"
           href="?id={{::portal.homepage_dv}}">
          <span ng-bind="portal.title"></span>
          <span class="navbar-tagline"
                ng-if="portal.description"
                ng-bind="portal.description"></span>
        </a>
        <a class="navbar-brand navbar-brand-logo"
           ng-if="::portal.logo"
           ng-href="?id={{::portal.homepage_dv}}"
           ng-click="collapse()"
           aria-label="{{::logoText}}">
          <img ng-src="{{::portal.logo}}"
               title="{{::portal.title}}"
               alt="{{::portal.logo_alt_text || portal.title}} ${Logo}" />
          <span class="navbar-tagline"
                ng-if="portal.description"
                ng-bind="portal.description"></span>
        </a>
        <button ng-if="data.hasMenuItems || (!user.logged_in && page.id != portal.login_page_dv && !data.hasLogin) || user.logged_in"
                type="button"
                class="navbar-toggle collapsed"
                data-toggle="collapse"
                data-placement="bottom"
                data-toggle-second="tooltip"
                data-original-title="{{::data.toggleMsg}}"
                data-target="#sp-nav-bar"
                aria-haspopup="menu">
          <span class="sr-only">${Toggle navigation}</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
      </div>

      <div sp-navbar-toggle=""
           class="collapse navbar-collapse"
           id="sp-nav-bar"
           role="navigation">
        <!-- Navigation menu (REQUIRED) -->
        <sp-widget widget="::data.menu"></sp-widget>
        <!-- Language Selector -->
        <sp-widget widget="::data.langSelector"></sp-widget>
        <!-- Login link for unauthenticated users -->
        <ul ng-if="(!user.logged_in && page.id != portal.login_page_dv && !data.hasLogin)"
            class="nav navbar-nav navbar-right"
            role="presentation">
          <li role="presentation">
            <a href ng-click="::openLogin()">${Login}</a>
          </li>
        </ul>
        <!-- User controls when logged in -->
        <ul ng-if="user.logged_in"
            class="nav navbar-nav navbar-right">
          <!-- Avatar dropdown (desktop) - ONLY Profile and Logout -->
          <li ng-if="showAvatar"
              class="hidden-xs hidden-sm dropdown">
            <a href
               class="toggle-dropdown"
               data-toggle="dropdown"
               aria-expanded="false"
               aria-label="{{::data.profileBtnMsg}}: {{::user.name}}"
               id="profile-dropdown"
               role="button"
               aria-haspopup="true">
              <span class="navbar-avatar" aria-hidden="true"><sn-avatar class="avatar-small-medium" primary="avatarProfile" /></span>
              <span class="visible-lg-inline">{{::user.name}}</span>
            </a>
            <ul class="dropdown-menu" aria-label="{{::data.profileBtnMsg}}">
              <li>
                <a tabindex="-1" ng-href="?id=user_profile&sys_id={{::user.sys_id}}">${Profile}</a>
              </li>
              <li ng-if="::!(isViewNative || isViewNativeTablet)">
                <a tabindex="-1" href="{{::portal.logoutUrl}}">${Logout}</a>
              </li>
            </ul>
          </li>
          <!-- Mobile avatar and links -->
          <li ng-if="showSMAvatar"
              class="visible-xs-block visible-sm-block">
            <a ng-href="?id=user_profile&sys_id={{::user.sys_id}}"
               ng-click="collapse()">
              <span class="navbar-avatar"><sn-avatar class="avatar-small-medium" primary="avatarProfile" /></span>{{::user.name}}
            </a>
          </li>
          <li ng-if="::!(isViewNative || isViewNativeTablet)"
              class="visible-xs-block visible-sm-block">
            <a ng-href="{{::portal.logoutUrl}}" ng-click="collapse()">${Logout}</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>
